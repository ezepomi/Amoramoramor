<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestros planes ✨❤️</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Outfit y Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #FDFBF7;
            color: #4A3E3D;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .font-cursive {
            font-family: 'Caveat', cursive;
        }
        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }
        .animate-heart-1 { animation: heartPulse 1.4s infinite ease-in-out; }
        .animate-heart-2 { animation: heartPulse 1.4s infinite ease-in-out 0.2s; }
        .animate-heart-3 { animation: heartPulse 1.4s infinite ease-in-out 0.4s; }
        .soft-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid #F0E6DF;
            box-shadow: 0 8px 24px -4px rgba(74, 62, 61, 0.04);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyASEQnD0tZYJu-VZMzTITQp8JbPg-L1JX0",
            authDomain: "amor-64f24.firebaseapp.com",
            projectId: "amor-64f24",
            storageBucket: "amor-64f24.firebasestorage.app",
            messagingSenderId: "839882538903",
            appId: "1:839882538903:web:89759b5effe6b782f24ed2",
            measurementId: "G-CZY3VXDK08"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        const FRASES_CARGA = [
            "Caemos en la misma nota, al mismo tiempo. ✨",
            "Por ti, baby, sería Batman. 🦇❤️",
            "No soy muy inteligente pero sé lo que es el amor. 🧸"
        ];

        const CATEGORIAS = [
            { id: 'pelis', titulo: 'Pelis & Series', icono: '🎬', color: 'bg-[#EAE4F2]', text: 'text-[#5B4870]', border: 'border-[#D8CCE6]' },
            { id: 'lugares', titulo: 'Lugares por Visitar', icono: '📍', color: 'bg-[#FBE8DB]', text: 'text-[#825435]', border: 'border-[#F5D5C0]' },
            { id: 'espectaculos', titulo: 'Espectáculos', icono: '🎟️', color: 'bg-[#E2F0D9]', text: 'text-[#416132]', border: 'border-[#CCE3BF]' },
            { id: 'comer', titulo: 'Salir a Comer', icono: '🍽️', color: 'bg-[#FCF4DD]', text: 'text-[#7A6221]', border: 'border-[#F7E7B8]' },
            { id: 'cocinar', titulo: 'Para Cocinar', icono: '👨‍🍳', color: 'bg-[#FCE2E6]', text: 'text-[#823A46]', border: 'border-[#F7C6CE]' }
        ];

        const calcularDias = (timestamp) => {
            if (!timestamp) return "Reciente";
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return "Hoy ✨";
            if (diffDays === 1) return "Hace 1 día 🌸";
            return `Hace ${diffDays} días 📅`;
        };

        const SwitchToggle = ({ checked, onChange }) => (
            <button 
                type="button"
                onClick={(e) => { e.stopPropagation(); onChange(); }}
                className={`w-14 h-8 flex items-center rounded-full p-1 transition-colors duration-300 ${checked ? 'bg-[#A8D5BA]' : 'bg-[#E5DCD6]'}`}
            >
                <div className={`bg-white w-6 h-6 rounded-full shadow-md transform transition-transform duration-300 flex items-center justify-center text-xs ${checked ? 'translate-x-6' : 'translate-x-0'}`}>
                    {checked ? '✅' : '⏳'}
                </div>
            </button>
        );

        const StarRating = ({ rating, setRating }) => (
            <div className="flex gap-1 justify-center my-2">
                {[1, 2, 3, 4, 5].map((star) => (
                    <button
                        key={star}
                        type="button"
                        onClick={() => setRating(star)}
                        className={`text-2xl transition-transform active:scale-125 ${star <= rating ? 'text-[#FBBF24]' : 'text-[#E5DCD6]'}`}
                    >
                        ★
                    </button>
                ))}
            </div>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [fraseActual, setFraseActual] = useState("");
            const [categoria, setCategoria] = useState(null);
            const [planes, setPlanes] = useState([]);
            const [planSeleccionado, setPlanSeleccionado] = useState(null);
            const [filtroEstado, setFiltroEstado] = useState('todos');
            
            const [mostrarForm, setMostrarForm] = useState(false);
            const [planEditando, setPlanEditando] = useState(null);

            // Campos de formulario dinámicos
            const [formCampos, setFormCampos] = useState({
                titulo: '',
                quienLaVio: 'Nadie',
                plataforma: '',
                ubicacion: '',
                diasHorarios: '',
                agendarFecha: '',
                fuePreviamente: 'Nadie',
                especialidad: '',
                ingredientes: '',
                pasos: '',
                linkReceta: ''
            });

            const [miPuntaje, setMiPuntaje] = useState(5);
            const [miComentario, setMiComentario] = useState('');

            useEffect(() => {
                setFraseActual(FRASES_CARGA[Math.floor(Math.random() * FRASES_CARGA.length)]);
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setTimeout(() => setLoading(false), 2000);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !categoria) return;
                const unsub = db.collection('planes')
                    .where('categoria', '==', categoria.id)
                    .orderBy('fechaCreacion', 'desc')
                    .onSnapshot(snapshot => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setPlanes(data);
                    });
                return () => unsub();
            }, [categoria, user]);

            const login = () => auth.signInWithPopup(googleProvider).catch(err => alert(err.message));
            const logout = () => auth.signOut();

            const resetForm = () => {
                setFormCampos({
                    titulo: '',
                    quienLaVio: 'Nadie',
                    plataforma: '',
                    ubicacion: '',
                    diasHorarios: '',
                    agendarFecha: '',
                    fuePreviamente: 'Nadie',
                    especialidad: '',
                    ingredientes: '',
                    pasos: '',
                    linkReceta: ''
                });
                setPlanEditando(null);
            };

            const guardarPlan = async (e) => {
                e.preventDefault();
                if (!formCampos.titulo) return;

                const datosBase = {
                    categoria: categoria.id,
                    titulo: formCampos.titulo,
                    quienLaVio: formCampos.quienLaVio,
                    plataforma: formCampos.plataforma,
                    ubicacion: formCampos.ubicacion,
                    diasHorarios: formCampos.diasHorarios,
                    agendarFecha: formCampos.agendarFecha,
                    fuePreviamente: formCampos.fuePreviamente,
                    especialidad: formCampos.especialidad,
                    ingredientes: formCampos.ingredientes,
                    pasos: formCampos.pasos,
                    linkReceta: formCampos.linkReceta
                };

                if (planEditando) {
                    await db.collection('planes').doc(planEditando.id).update(datosBase);
                } else {
                    await db.collection('planes').add({
                        ...datosBase,
                        fechaCreacion: firebase.firestore.FieldValue.serverTimestamp(),
                        creadoPor: user.displayName,
                        resenas: {}
                    });
                }
                resetForm();
                setMostrarForm(false);
            };

            const abrirEdicion = (plan, e) => {
                e.stopPropagation();
                setPlanEditando(plan);
                setFormCampos({
                    titulo: plan.titulo || '',
                    quienLaVio: plan.quienLaVio || 'Nadie',
                    plataforma: plan.plataforma || '',
                    ubicacion: plan.ubicacion || '',
                    diasHorarios: plan.diasHorarios || '',
                    agendarFecha: plan.agendarFecha || '',
                    fuePreviamente: plan.fuePreviamente || 'Nadie',
                    especialidad: plan.especialidad || '',
                    ingredientes: plan.ingredientes || '',
                    pasos: plan.pasos || '',
                    linkReceta: plan.linkReceta || ''
                });
                setMostrarForm(true);
            };

            const eliminarPlan = async (planId, e) => {
                e.stopPropagation();
                if (confirm("¿Querés eliminar este plan? 🗑️")) {
                    await db.collection('planes').doc(planId).delete();
                    if (planSeleccionado && planSeleccionado.id === planId) {
                        setPlanSeleccionado(null);
                    }
                }
            };

            const toggleEstadoPlan = async (plan) => {
                const planRef = db.collection('planes').doc(plan.id);
                const miResenaActual = plan.resenas && plan.resenas[user.uid];
                const estadoActual = miResenaActual ? miResenaActual.estado : 'Pendiente';
                const nuevoEstado = estadoActual === 'Hecho' ? 'Pendiente' : 'Hecho';

                await planRef.set({
                    resenas: {
                        [user.uid]: {
                            nombre: user.displayName.split(' ')[0],
                            puntaje: miResenaActual ? miResenaActual.puntaje : 5,
                            comentario: miResenaActual ? miResenaActual.comentario : '',
                            estado: nuevoEstado
                        }
                    }
                }, { merge: true });

                if (planSeleccionado && planSeleccionado.id === plan.id) {
                    setPlanSeleccionado(prev => ({
                        ...prev,
                        resenas: {
                            ...prev.resenas,
                            [user.uid]: {
                                nombre: user.displayName.split(' ')[0],
                                puntaje: miResenaActual ? miResenaActual.puntaje : 5,
                                comentario: miResenaActual ? miResenaActual.comentario : '',
                                estado: nuevoEstado
                            }
                        }
                    }));
                }
            };

            const guardarResena = async (e) => {
                e.preventDefault();
                const planRef = db.collection('planes').doc(planSeleccionado.id);
                const miResenaActual = planSeleccionado.resenas && planSeleccionado.resenas[user.uid];
                const miEstadoActual = miResenaActual ? miResenaActual.estado : 'Hecho';

                await planRef.set({
                    resenas: {
                        [user.uid]: {
                            nombre: user.displayName.split(' ')[0],
                            puntaje: Number(miPuntaje),
                            comentario: miComentario,
                            estado: miEstadoActual
                        }
                    }
                }, { merge: true });

                setPlanSeleccionado(prev => ({
                    ...prev,
                    resenas: {
                        ...prev.resenas,
                        [user.uid]: {
                            nombre: user.displayName.split(' ')[0],
                            puntaje: Number(miPuntaje),
                            comentario: miComentario,
                            estado: miEstadoActual
                        }
                    }
                }));
                alert("¡Tu valoración se guardó con éxito! ✨");
            };

            // PANTALLA DE CARGA
            if (loading) return (
                <div className="min-h-screen flex flex-col justify-between items-center p-8 text-center select-none bg-[#FDFBF7]">
                    <div className="pt-12">
                        <span className="text-xs font-bold text-[#B39283] tracking-widest uppercase">Nuestros Planes</span>
                    </div>
                    <div className="flex flex-col items-center gap-6">
                        <div className="flex items-center justify-center gap-3">
                            <span className="text-3xl animate-heart-1">🌸</span>
                            <span className="text-5xl animate-heart-2">💖</span>
                            <span className="text-3xl animate-heart-3">✨</span>
                        </div>
                        <p className="text-base font-medium text-[#6E5A58] max-w-xs leading-relaxed italic">"{fraseActual}"</p>
                    </div>
                    <div className="pb-6">
                        <span className="font-cursive text-5xl text-[#D88A8A] font-bold tracking-wider">J&E</span>
                    </div>
                </div>
            );

            // LOGIN
            if (!user) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#FDFBF7]">
                    <div className="w-full max-w-sm soft-card p-8 rounded-[2.5rem] space-y-6">
                        <div className="text-5xl">✨❤️</div>
                        <h1 className="text-2xl font-bold text-[#4A3E3D]">Nuestros planes</h1>
                        <p className="text-xs text-[#8C7A78] leading-relaxed">Un espacio privado para organizar nuestras citas, pelis, lugares y momentos juntos.</p>
                        <button onClick={login} className="w-full bg-[#E8A598] hover:bg-[#DF9789] text-white py-4 rounded-full font-semibold shadow-sm active:scale-95 transition-all">
                            Ingresar con Google
                        </button>
                    </div>
                    <span className="font-cursive text-4xl text-[#D88A8A] font-bold mt-8">J&E</span>
                </div>
            );

            // VISTA DETALLE DEL PLAN
            if (planSeleccionado) {
                const resenas = planSeleccionado.resenas ? Object.values(planSeleccionado.resenas) : [];
                const miResenaActual = planSeleccionado.resenas && planSeleccionado.resenas[user.uid];
                const miEstado = miResenaActual ? miResenaActual.estado : 'Pendiente';

                const ratingPareja = resenas.filter(r => r.puntaje).length > 0
                    ? (resenas.reduce((acc, r) => acc + (r.puntaje || 0), 0) / resenas.filter(r => r.puntaje).length).toFixed(1)
                    : null;

                return (
                    <div className="min-h-screen p-5 max-w-md mx-auto">
                        <div className="flex items-center justify-between mb-4">
                            <button onClick={() => setPlanSeleccionado(null)} className="text-xs font-bold text-[#8C7A78] bg-white px-4 py-2 rounded-full soft-card">
                                ⬅ Volver
                            </button>
                            <div className="flex gap-2">
                                <button onClick={(e) => abrirEdicion(planSeleccionado, e)} className="text-xs bg-white p-2 rounded-full soft-card">✏️</button>
                                <button onClick={(e) => eliminarPlan(planSeleccionado.id, e)} className="text-xs bg-white p-2 rounded-full soft-card">🗑️</button>
                            </div>
                        </div>
                        
                        <div className="soft-card p-6 rounded-[2.5rem] mb-5 text-center relative">
                            <span className="text-4xl block mb-2">{categoria.icono}</span>
                            <h2 className="text-2xl font-bold text-[#4A3E3D]">{planSeleccionado.titulo}</h2>

                            {/* Detalles según categoría */}
                            <div className="mt-4 text-xs text-[#8C7A78] space-y-1.5 text-left bg-[#FDFBF7] p-4 rounded-2xl border border-[#F0E6DF]">
                                {categoria.id === 'pelis' && (
                                    <>
                                        <p>📺 <b>Plataforma:</b> {planSeleccionado.plataforma || 'No especificada'}</p>
                                        <p>👁️ <b>¿Quién la vio?:</b> {planSeleccionado.quienLaVio}</p>
                                    </>
                                )}
                                {categoria.id === 'lugares' && (
                                    <>
                                        <p>📍 <b>Ubicación:</b> {planSeleccionado.ubicacion || 'No especificada'}</p>
                                        <p>🕒 <b>Días/Horarios:</b> {planSeleccionado.diasHorarios || 'No especificados'}</p>
                                        {planSeleccionado.agendarFecha && <p>📅 <b>Fecha agendada:</b> {planSeleccionado.agendarFecha}</p>}
                                        <p>🙋‍♂️ <b>¿Alguno fue previamente?:</b> {planSeleccionado.fuePreviamente}</p>
                                    </>
                                )}
                                {categoria.id === 'espectaculos' && (
                                    <>
                                        <p>🎟️ <b>Ubicación/Lugar:</b> {planSeleccionado.ubicacion || 'No especificada'}</p>
                                        <p>🕒 <b>Días/Horarios:</b> {planSeleccionado.diasHorarios || 'No especificados'}</p>
                                        {planSeleccionado.agendarFecha && <p>📅 <b>Fecha agendada:</b> {planSeleccionado.agendarFecha}</p>}
                                    </>
                                )}
                                {categoria.id === 'comer' && (
                                    <>
                                        <p>📍 <b>Ubicación:</b> {planSeleccionado.ubicacion || 'No especificada'}</p>
                                        <p>🍕 <b>Especialidad:</b> {planSeleccionado.especialidad || 'No especificada'}</p>
                                        <p>🕒 <b>Días/Horarios:</b> {planSeleccionado.diasHorarios || 'No especificados'}</p>
                                        {planSeleccionado.agendarFecha && <p>📅 <b>Fecha agendada:</b> {planSeleccionado.agendarFecha}</p>}
                                    </>
                                )}
                                {categoria.id === 'cocinar' && (
                                    <>
                                        <p>🛒 <b>Ingredientes:</b> {planSeleccionado.ingredientes || 'No especificados'}</p>
                                        <p>👨‍🍳 <b>Pasos:</b> {planSeleccionado.pasos || 'No especificados'}</p>
                                        {planSeleccionado.linkReceta && (
                                            <p>🔗 <b>Link:</b> <a href={planSeleccionado.linkReceta} target="_blank" rel="noreferrer" className="text-[#D88A8A] underline">Ver receta completa</a></p>
                                        )}
                                    </>
                                )}
                            </div>

                            <div className="flex items-center justify-center gap-2 mt-4 pt-4 border-t border-[#F2E8E1]">
                                <span className="text-xs font-bold text-[#8C7A78]">Estado para mí:</span>
                                <SwitchToggle 
                                    checked={miEstado === 'Hecho'} 
                                    onChange={() => toggleEstadoPlan(planSeleccionado)} 
                                />
                            </div>

                            {ratingPareja && (
                                <div className="mt-4 bg-[#FFF0F2] inline-block px-4 py-2 rounded-full text-[#D88A8A] font-bold text-xs">
                                    💕 Rating de la pareja: {ratingPareja} / 5 ⭐
                                </div>
                            )}
                        </div>

                        {/* RESEÑAS Y ESTRELLAS */}
                        <div className="space-y-3 mb-6">
                            <h3 className="font-bold text-base text-[#4A3E3D] ml-2">Nuestras Opiniones ✨</h3>
                            {resenas.length === 0 && (
                                <p className="text-xs text-[#8C7A78] ml-2 italic">Aún no hay opiniones guardadas.</p>
                            )}
                            {resenas.map((r, idx) => (
                                <div key={idx} className="soft-card p-4 rounded-3xl">
                                    <div className="flex justify-between items-center mb-1">
                                        <span className="font-bold text-[#4A3E3D] text-sm">{r.nombre}</span>
                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${r.estado === 'Hecho' ? 'bg-[#E2F0D9] text-[#416132]' : 'bg-[#F2E8E1] text-[#8C7A78]'}`}>
                                            {r.estado}
                                        </span>
                                    </div>
                                    {r.puntaje && <div className="text-[#FBBF24] text-xs mb-1">{"★".repeat(r.puntaje)}{"☆".repeat(5 - r.puntaje)}</div>}
                                    {r.comentario && <p className="text-xs text-[#6E5A58] italic">"{r.comentario}"</p>}
                                </div>
                            ))}
                        </div>

                        {/* VALORAR CON ESTRELLAS */}
                        <div className="soft-card p-6 rounded-[2.5rem]">
                            <h3 className="font-bold text-sm text-[#4A3E3D] mb-2 text-center">Dejar mi valoración</h3>
                            <form onSubmit={guardarResena} className="space-y-3">
                                <StarRating rating={miPuntaje} setRating={setMiPuntaje} />
                                <div>
                                    <label className="text-[10px] font-bold text-[#8C7A78] ml-2">Tu Comentario / Reseña</label>
                                    <textarea 
                                        placeholder="¿Qué te pareció o qué expectativas tenés?" 
                                        value={miComentario} 
                                        onChange={e => setMiComentario(e.target.value)} 
                                        className="w-full bg-[#FDFBF7] p-3 rounded-2xl text-xs outline-none text-[#4A3E3D] border border-[#F0E6DF] resize-none" 
                                        rows="3" 
                                    ></textarea>
                                </div>
                                <button type="submit" className="w-full bg-[#B39283] text-white py-3 rounded-2xl text-xs font-bold active:scale-95 transition-all">
                                    Guardar Valoración
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // VISTA CATEGORÍA SELECCIONADA
            if (categoria) {
                const planesFiltrados = planes.filter(p => {
                    const miEstado = p.resenas && p.resenas[user.uid] ? p.resenas[user.uid].estado : 'Pendiente';
                    if (filtroEstado === 'pendiente') return miEstado === 'Pendiente';
                    if (filtroEstado === 'hecho') return miEstado === 'Hecho';
                    return true;
                });

                return (
                    <div className="min-h-screen p-5 max-w-md mx-auto">
                        <header className="flex items-center justify-between mb-5">
                            <button onClick={() => { setCategoria(null); setMostrarForm(false); resetForm(); }} className="text-xs font-bold text-[#8C7A78] bg-white px-4 py-2 rounded-full soft-card">
                                ⬅ Categorías
                            </button>
                            <div className={`px-4 py-2 rounded-full ${categoria.color} ${categoria.text} ${categoria.border} border font-bold text-xs flex items-center gap-2 shadow-sm`}>
                                <span>{categoria.icono}</span>
                                <span>{categoria.titulo}</span>
                            </div>
                        </header>

                        {/* Filtros */}
                        <div className="flex bg-[#F2E8E1] p-1 rounded-full mb-5 text-xs font-bold text-[#8C7A78]">
                            <button 
                                onClick={() => setFiltroEstado('todos')} 
                                className={`flex-1 py-2 rounded-full transition-all ${filtroEstado === 'todos' ? 'bg-white text-[#4A3E3D] shadow-sm' : ''}`}
                            >
                                Todos ({planes.length})
                            </button>
                            <button 
                                onClick={() => setFiltroEstado('pendiente')} 
                                className={`flex-1 py-2 rounded-full transition-all ${filtroEstado === 'pendiente' ? 'bg-white text-[#4A3E3D] shadow-sm' : ''}`}
                            >
                                ⏳ Pendientes
                            </button>
                            <button 
                                onClick={() => setFiltroEstado('hecho')} 
                                className={`flex-1 py-2 rounded-full transition-all ${filtroEstado === 'hecho' ? 'bg-white text-[#4A3E3D] shadow-sm' : ''}`}
                            >
                                ✅ Hechos
                            </button>
                        </div>

                        {!mostrarForm ? (
                            <>
                                <div className="space-y-3 mb-6">
                                    {planesFiltrados.length === 0 ? (
                                        <div className="text-center p-8 soft-card rounded-3xl text-[#8C7A78] text-xs">
                                            No hay planes en esta lista todavía. ¡Agregá uno nuevo! ✨
                                        </div>
                                    ) : (
                                        planesFiltrados.map(plan => {
                                            const miEstado = plan.resenas && plan.resenas[user.uid] ? plan.resenas[user.uid].estado : 'Pendiente';
                                            return (
                                                <div 
                                                    key={plan.id} 
                                                    onClick={() => setPlanSeleccionado(plan)} 
                                                    className="soft-card p-4 rounded-3xl flex items-center justify-between cursor-pointer active:scale-98 transition-all"
                                                >
                                                    <div className="pr-2 flex-1">
                                                        <div className="flex items-center gap-2 mb-1">
                                                            <h3 className="font-bold text-[#4A3E3D] text-base">{plan.titulo}</h3>
                                                            <span className="text-[10px] text-[#A3928E] bg-[#F7EFEA] px-2 py-0.5 rounded-full font-medium">
                                                                {calcularDias(plan.fechaCreacion)}
                                                            </span>
                                                        </div>
                                                        <p className="text-xs text-[#8C7A78] line-clamp-1">
                                                            {categoria.id === 'pelis' && (plan.plataforma || 'Ver detalle')}
                                                            {categoria.id === 'lugares' && (plan.ubicacion || 'Ver detalle')}
                                                            {categoria.id === 'espectaculos' && (plan.ubicacion || 'Ver detalle')}
                                                            {categoria.id === 'comer' && (plan.especialidad || plan.ubicacion || 'Ver detalle')}
                                                            {categoria.id === 'cocinar' && (plan.ingredientes || 'Ver ingredientes')}
                                                        </p>
                                                    </div>

                                                    <div className="flex items-center gap-2">
                                                        <SwitchToggle 
                                                            checked={miEstado === 'Hecho'} 
                                                            onChange={() => toggleEstadoPlan(plan)} 
                                                        />
                                                        <button onClick={(e) => abrirEdicion(plan, e)} className="text-xs p-1 text-[#A3928E] hover:text-[#4A3E3D]">✏️</button>
                                                        <button onClick={(e) => eliminarPlan(plan.id, e)} className="text-xs p-1 text-[#A3928E] hover:text-red-400">🗑️</button>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>

                                <button 
                                    onClick={() => { resetForm(); setMostrarForm(true); }} 
                                    className="w-full bg-[#4A3E3D] text-[#FDFBF7] py-4 rounded-full font-bold shadow-md active:scale-95 transition-all text-sm flex items-center justify-center gap-2"
                                >
                                    <span>+</span> Agregar Plan en {categoria.titulo}
                                </button>
                            </>
                        ) : (
                            /* Formulario Dinámico según Categoría */
                            <div className="soft-card p-6 rounded-[2.5rem]">
                                <h3 className="font-bold text-[#4A3E3D] text-base mb-4 text-center">
                                    {planEditando ? "Editar Plan ✏️" : `Nuevo Plan en ${categoria.titulo} 💖`}
                                </h3>
                                <form onSubmit={guardarPlan} className="space-y-3.5 text-xs">
                                    <div>
                                        <label className="font-bold text-[#8C7A78] ml-2">Nombre / Título *</label>
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="ej. Batman, Guerrin, Pasteles de crema..." 
                                            value={formCampos.titulo} 
                                            onChange={e => setFormCampos({...formCampos, titulo: e.target.value})} 
                                            className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl font-bold outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" 
                                        />
                                    </div>

                                    {/* Campos para Pelis & Series */}
                                    {categoria.id === 'pelis' && (
                                        <>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Plataforma</label>
                                                <input type="text" placeholder="ej. Netflix, Max, Disney+, Cine" value={formCampos.plataforma} onChange={e => setFormCampos({...formCampos, plataforma: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">¿Quién la vio?</label>
                                                <select value={formCampos.quienLaVio} onChange={e => setFormCampos({...formCampos, quienLaVio: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl font-bold outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]">
                                                    <option value="Nadie">Nadie</option>
                                                    <option value="Eze">Eze</option>
                                                    <option value="Juli">Juli</option>
                                                    <option value="Ambos">Ambos</option>
                                                </select>
                                            </div>
                                        </>
                                    )}

                                    {/* Campos para Lugares por Visitar */}
                                    {categoria.id === 'lugares' && (
                                        <>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Ubicación / Dirección</label>
                                                <input type="text" placeholder="ej. Tigre, San Telmo, Palermo" value={formCampos.ubicacion} onChange={e => setFormCampos({...formCampos, ubicacion: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Días y Horarios</label>
                                                <input type="text" placeholder="ej. Mar a Dom 10 a 18 hs" value={formCampos.diasHorarios} onChange={e => setFormCampos({...formCampos, diasHorarios: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Agendar Fecha (Opcional)</label>
                                                <input type="date" value={formCampos.agendarFecha} onChange={e => setFormCampos({...formCampos, agendarFecha: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">¿Alguno fue previamente?</label>
                                                <select value={formCampos.fuePreviamente} onChange={e => setFormCampos({...formCampos, fuePreviamente: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl font-bold outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]">
                                                    <option value="Nadie">Nadie</option>
                                                    <option value="Eze">Eze</option>
                                                    <option value="Juli">Juli</option>
                                                    <option value="Ambos">Ambos</option>
                                                </select>
                                            </div>
                                        </>
                                    )}

                                    {/* Campos para Espectáculos */}
                                    {categoria.id === 'espectaculos' && (
                                        <>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Ubicación / Estadio / Teatro</label>
                                                <input type="text" placeholder="ej. Movistar Arena, Teatro Gran Rex" value={formCampos.ubicacion} onChange={e => setFormCampos({...formCampos, ubicacion: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Días y Horarios</label>
                                                <input type="text" placeholder="ej. Viernes 21 hs" value={formCampos.diasHorarios} onChange={e => setFormCampos({...formCampos, diasHorarios: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Agendar Fecha del Evento</label>
                                                <input type="date" value={formCampos.agendarFecha} onChange={e => setFormCampos({...formCampos, agendarFecha: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                        </>
                                    )}

                                    {/* Campos para Salir a Comer */}
                                    {categoria.id === 'comer' && (
                                        <>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Ubicación / Barrio</label>
                                                <input type="text" placeholder="ej. Av. Corrientes, Palermo Hollywood" value={formCampos.ubicacion} onChange={e => setFormCampos({...formCampos, ubicacion: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Especialidad recomendada</label>
                                                <input type="text" placeholder="ej. Pizza de muzzarella, Pastas rellenas" value={formCampos.especialidad} onChange={e => setFormCampos({...formCampos, especialidad: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Días y Horarios</label>
                                                <input type="text" placeholder="ej. Todos los días 12 a 00 hs" value={formCampos.diasHorarios} onChange={e => setFormCampos({...formCampos, diasHorarios: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Agendar Fecha (Opcional)</label>
                                                <input type="date" value={formCampos.agendarFecha} onChange={e => setFormCampos({...formCampos, agendarFecha: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                        </>
                                    )}

                                    {/* Campos para Para Cocinar */}
                                    {categoria.id === 'cocinar' && (
                                        <>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Ingredientes principales</label>
                                                <textarea placeholder="ej. Harina, huevos, crema de leche, chocolate..." value={formCampos.ingredientes} onChange={e => setFormCampos({...formCampos, ingredientes: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF] resize-none" rows="2"></textarea>
                                            </div>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Pasos de la receta</label>
                                                <textarea placeholder="ej. 1. Mezclar todo. 2. Hornear 20 min..." value={formCampos.pasos} onChange={e => setFormCampos({...formCampos, pasos: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF] resize-none" rows="2"></textarea>
                                            </div>
                                            <div>
                                                <label className="font-bold text-[#8C7A78] ml-2">Link de la receta online (Opcional)</label>
                                                <input type="url" placeholder="https://..." value={formCampos.linkReceta} onChange={e => setFormCampos({...formCampos, linkReceta: e.target.value})} className="w-full bg-[#FDFBF7] p-3.5 rounded-2xl outline-none text-[#4A3E3D] mt-1 border border-[#F0E6DF]" />
                                            </div>
                                        </>
                                    )}

                                    <div className="flex gap-3 pt-3">
                                        <button 
                                            type="button" 
                                            onClick={() => { setMostrarForm(false); resetForm(); }} 
                                            className="flex-1 bg-[#F2E8E1] text-[#8C7A78] py-3.5 rounded-2xl font-bold"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 bg-[#E8A598] text-white py-3.5 rounded-2xl font-bold shadow-sm"
                                        >
                                            {planEditando ? "Actualizar" : "Guardar"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        )}
                    </div>
                );
            }

            // MENÚ PRINCIPAL
            return (
                <div className="min-h-screen pb-12 px-5 max-w-md mx-auto">
                    <header className="pt-8 pb-6 flex items-center justify-between">
                        <div>
                            <h1 className="text-2xl font-bold text-[#4A3E3D]">Nuestros planes ✨❤️</h1>
                        </div>
                        <button onClick={logout} className="text-xs font-bold text-[#B39283] bg-white px-3 py-1.5 rounded-full soft-card">
                            Salir
                        </button>
                    </header>

                    <div className="space-y-3.5">
                        {CATEGORIAS.map(cat => (
                            <div 
                                key={cat.id} 
                                onClick={() => { setCategoria(cat); setFiltroEstado('todos'); }} 
                                className={`${cat.color} ${cat.border} border p-5 rounded-[2rem] cursor-pointer soft-card hover:shadow-md transition-all active:scale-98 flex items-center justify-between`}
                            >
                                <div className="flex items-center gap-4">
                                    <div className="text-3xl bg-white/80 p-3 rounded-2xl shadow-sm">{cat.icono}</div>
                                    <div>
                                        <h2 className={`font-bold text-base ${cat.text}`}>{cat.titulo}</h2>
                                        <p className="text-xs text-[#8C7A78] font-medium">Ver lista de planes</p>
                                    </div>
                                </div>
                                <span className={`text-lg ${cat.text} opacity-60`}>➔</span>
                            </div>
                        ))}
                        <div className="text-center pt-8">
                            <span className="font-cursive text-5xl text-[#D88A8A] font-bold tracking-widest opacity-80">J&E</span>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
